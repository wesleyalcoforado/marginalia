[package]
name = "state"
version = "0.1.0"
edition = "2021"

[[test]]
name = "cycles"
path = "integration/cycles.rs"

[dependencies]
marginalia_core = { path = "../marginalia_core" }
texts = { path = "../texts" }
image = { version = "0.25", default-features = false }
chrono = "0.4"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[dev-dependencies]
tempfile = "3.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
