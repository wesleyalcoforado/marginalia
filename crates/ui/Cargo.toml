[package]
name = "ui"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "marginalia"
path = "src/main.rs"

[[test]]
name = "layers"
path = "integration/layers.rs"

[dependencies]
marginalia_core = { path = "../marginalia_core" }
texts = { path = "../texts" }
state = { path = "../state" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
image = { version = "0.25", default-features = false }
chrono = "0.4"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
